name: CI Pipeline 
on: 
push: 
jobs: 
pull_request: 
build: 
runs-on: ubuntu-latest 
steps: 
- name: Checkout repository 
uses: actions/checkout@v4 
- name: Set up Python 
uses: actions/setup-python@v5 with: 
python-version: '3.x' 
- name: Check Python syntax 
run: python -m py_compile hello.py 
- name: Run Python program 
run: python hello.py 
- name: Test program 
run: python -c "from hello import greet; assert greet() is None; print('Test Passed!")"
